# Factory settings for this repo, sourced by the factory scripts (bash syntax).
# Tune the limits here; the hard maxima from the factory spec are 5 agents, 3 implementers, 5 loops.

HUMAN_LOGIN=Tobias-Braun
BOT_LOGIN=tobi-factory-bot
BOT_EMAIL=factory-bot@tobi-braun.com

TICK_INTERVAL_MIN=15

MAX_AGENTS=1
MAX_IMPLEMENTERS=1
MAX_REVIEW_LOOPS=5

# Implementer wall clock per issue; review time is not counted.
IMPL_WALLCLOCK_MIN=40
SIZE_S_RUNS=1
SIZE_S_MIN=15
SIZE_M_RUNS=3
SIZE_M_MIN=30

# Wall clock for one run of the other roles (requirements, spec, reviewer).
RUN_WALLCLOCK_MIN=20

# Budget proxy: agent runs per day across all roles.
DAILY_RUN_CAP=20

# "opus" follows the newest Opus the installed Claude Code supports; pin a model ID here if needed.
ORCHESTRATOR_MODEL=opus
AGENT_MODEL=sonnet

MAX_TURNS_ORCHESTRATOR=15
MAX_TURNS_REQUIREMENTS=20
MAX_TURNS_SPEC=30
MAX_TURNS_IMPLEMENTER=80
MAX_TURNS_REVIEWER=30
